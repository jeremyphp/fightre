name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self test
        run: python -m fightre.cli selftest
      - name: Native audit
        run: python -m fightre native examples
      - name: Runtime self-check
        run: python -m fightre selfcheck --strict --no-ports
      - name: Manifest round-trip
        run: |
          python -m fightre manifest sign examples/leaky-dist --secret ci-secret --out /tmp/manifest.json
          python -m fightre manifest verify /tmp/manifest.json --root examples/leaky-dist --secret ci-secret
          echo tamper >> examples/leaky-dist/config.json
          if python -m fightre manifest verify /tmp/manifest.json --root examples/leaky-dist --secret ci-secret; then
            echo "expected tamper detection to fail" >&2
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pinned: a newer ruff can enable new rules inside the selected groups and
      # turn a green branch red without a code change
      - run: pip install ruff==0.17.3
      - run: ruff check .

  client:
    name: client syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check fightre/client/fightre.js

  demo:
    name: end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python demo/run_demo.py
